name: DealCapital Selenium smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "tests/e2e/**"
      - "pytest.ini"
      - ".github/workflows/selenium-smoke.yml"

permissions:
  contents: read

jobs:
  public-browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DC_BASE_URL: https://deal-capital.vercel.app
      DC_BROWSER: chrome
      DC_HEADLESS: "1"
      DC_WAIT_SECONDS: "30"
      SE_AVOID_STATS: "true"
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tests/e2e/requirements.txt
      - name: Install test dependencies
        run: python -m pip install -r tests/e2e/requirements.txt
      - name: Validate Python syntax
        run: python -m compileall -q tests/e2e
      - name: Run browser smoke tests (read-only)
        run: python -m pytest -m smoke -v --junitxml=test-results/selenium-public.xml
      - name: Upload reports and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-smoke-results
          path: |
            test-results/*.xml
            test-results/screenshots/*.png
          if-no-files-found: warn
          retention-days: 7
